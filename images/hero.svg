<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050805"/>
      <stop offset="60%" stop-color="#081208"/>
      <stop offset="100%" stop-color="#0A1A0A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0"/>
      <stop offset="50%" stop-color="#76B900" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- corner frame: top-left -->
  <path d="M20,20 L110,20 L90,40 L20,40 Z" fill="none" stroke="#76B900" stroke-width="2"/>
  <path d="M20,20 L20,90 L40,110 L40,20 Z" fill="none" stroke="#76B900" stroke-width="2"/>
  <!-- corner frame: bottom-right -->
  <path d="M1180,280 L1090,280 L1110,260 L1180,260 Z" fill="none" stroke="#76B900" stroke-width="2"/>
  <path d="M1180,280 L1180,210 L1160,190 L1160,280 Z" fill="none" stroke="#76B900" stroke-width="2"/>

  <!-- skyline silhouette -->
  <g opacity="0.9">
    <rect x="640" y="150" width="14" height="110" fill="#0D2B0D"/>
    <rect x="662" y="120" width="10" height="140" fill="#0D2B0D"/>
    <rect x="680" y="170" width="18" height="90" fill="#0D2B0D"/>
    <rect x="706" y="100" width="12" height="160" fill="#0D2B0D"/>
    <rect x="726" y="145" width="16" height="115" fill="#0D2B0D"/>
    <rect x="750" y="80" width="8" height="180" fill="#0D2B0D"/>
    <rect x="766" y="160" width="20" height="100" fill="#0D2B0D"/>
    <rect x="794" y="130" width="10" height="130" fill="#0D2B0D"/>
    <rect x="812" y="175" width="14" height="85" fill="#0D2B0D"/>
    <rect x="834" y="110" width="10" height="150" fill="#0D2B0D"/>
    <rect x="852" y="155" width="16" height="105" fill="#0D2B0D"/>
    <rect x="878" y="95" width="8" height="165" fill="#0D2B0D"/>
    <rect x="894" y="165" width="18" height="95" fill="#0D2B0D"/>
    <rect x="920" y="135" width="10" height="125" fill="#0D2B0D"/>
    <rect x="750" y="80" width="8" height="12" fill="#76B900" opacity="0.7"/>
    <rect x="706" y="100" width="12" height="10" fill="#76B900" opacity="0.5"/>
    <rect x="878" y="95" width="8" height="10" fill="#76B900" opacity="0.5"/>
  </g>

  <!-- glowing road/river winding through the scene -->
  <path d="M0,260 C150,255 220,235 320,245 C420,255 480,220 600,225 C720,230 780,200 900,210 C1020,220 1100,205 1200,215"
        fill="none" stroke="url(#glow)" stroke-width="3"/>

  <!-- foreground ridge silhouette -->
  <path d="M0,300 L0,235 C120,215 200,255 300,240 C420,222 520,260 640,238 C760,218 860,250 980,232 C1080,218 1150,240 1200,230 L1200,300 Z" fill="#020402"/>

  <!-- seated figure silhouette (generic) -->
  <g transform="translate(215,215)" fill="#020402">
    <ellipse cx="0" cy="40" rx="34" ry="10"/>
    <path d="M-14,40 C-16,10 -8,-6 0,-8 C8,-6 16,10 14,40 Z"/>
    <circle cx="0" cy="-20" r="10"/>
  </g>

  <!-- chevrons -->
  <text x="565" y="150" font-family="'Courier New', monospace" font-size="26" fill="#76B900" opacity="0.6">&#187;&#187;</text>
  <text x="600" y="150" font-family="'Courier New', monospace" font-size="26" fill="#76B900" opacity="0.35" text-anchor="end">&#171;&#171;</text>

  <!-- top-left label -->
  <text x="40" y="58" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#C9D1D9">BUILD BETTER</text>
  <text x="40" y="76" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#C9D1D9">SHIP FASTER</text>
  <line x1="40" y1="88" x2="80" y2="88" stroke="#76B900" stroke-width="2"/>

  <!-- top-right label -->
  <text x="1160" y="45" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#C9D1D9" text-anchor="end">BUILD</text>
  <text x="1160" y="63" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#C9D1D9" text-anchor="end">SCALE</text>
  <text x="1160" y="81" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#C9D1D9" text-anchor="end">LEARN</text>
  <text x="1160" y="99" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#C9D1D9" text-anchor="end">REPEAT</text>
  <line x1="1120" y1="111" x2="1160" y2="111" stroke="#76B900" stroke-width="2"/>

  <!-- bottom-right label -->
  <text x="1160" y="200" font-family="'Courier New', monospace" font-size="13" letter-spacing="1" fill="#8FD400" text-anchor="end">IDEAS &#8594; SYSTEMS &#8594; IMPACT</text>

  <!-- name -->
  <text x="600" y="200" font-family="'Fira Code','Courier New',monospace" font-size="46" font-weight="700" fill="#76B900" text-anchor="middle">Aman Sharma</text>
  <text x="600" y="230" font-family="'Fira Code','Courier New',monospace" font-size="16" fill="#C9D1D9" text-anchor="middle">Backend &amp; Data Engineer · LLM Systems</text>
</svg>
